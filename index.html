<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rudy Zigzag Lab — dạy máy vẽ swing</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e; --accent:#2157f3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial; background:var(--bg); color:var(--txt);
         display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; }
  header { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; flex:0 0 auto; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  .ctl { display:flex; gap:6px; align-items:center; font-size:13px; flex-wrap:wrap; }
  select, input, button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:13px; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.warn { background:#9e1b1b; border-color:#9e1b1b; }
  #chart { width:100%; flex:1 1 auto; min-height:220px; touch-action:none; }
  .hint { font-size:12px; color:var(--mut); padding:6px 12px; border-top:1px solid var(--line); flex:0 0 auto; max-height:34vh; overflow:auto; }
  /* Mobile: nút to hơn cho dễ chạm, chữ không tràn */
  @media (max-width:720px){
    header h1 { width:100%; margin:0 0 2px; font-size:14px; }
    select, input, button { padding:8px 10px; font-size:14px; }
    .hint .legend { display:flex; margin:2px 0; }
  }
  .legend { display:inline-flex; gap:4px; align-items:center; margin-right:12px; }
  .sw { width:14px; height:3px; display:inline-block; }
  textarea { width:100%; height:70px; background:#0b0e14; color:#9ece6a; border:1px solid var(--line); font-family:monospace; font-size:11px; }
  .mode { padding:3px 8px; border-radius:6px; }
  .modeOn { background:#1f6feb; }
</style>
</head>
<body>
<header>
  <h1>🎯 Rudy Zigzag Lab</h1>
  <div class="ctl">
    <label>Nguồn:</label>
    <select id="src">
      <option value="binance">Binance (crypto, free)</option>
      <option value="csv">CSV (dán/upload)</option>
      <option value="sample">Mẫu có sẵn</option>
    </select>
  </div>
  <div class="ctl" id="binCtl">
    <input id="sym" value="BTCUSDT" size="9" title="Symbol Binance">
    <select id="tf">
      <option>1m</option><option>5m</option><option>15m</option><option>30m</option>
      <option selected>1h</option><option>4h</option><option>1d</option><option>1w</option>
    </select>
    <input id="lim" type="number" value="500" min="100" max="1000" size="4" title="Số nến">
    <button class="primary" onclick="loadData()">Tải</button>
  </div>
  <div class="ctl">
    <label>Thuật toán:</label>
    <select id="algo" onchange="switchAlgo()">
      <option value="fractal">Fractal (sóng trong sóng)</option>
      <option value="pct">% độ sâu hồi</option>
    </select>
  </div>
  <div class="ctl" id="fracCtl">
    <label>Pivot nội bộ:</label>
    <input id="innerLen" type="number" value="3" min="2" max="30" style="width:55px" oninput="recalc()">
    <label style="margin-left:10px"><input id="extFilter" type="checkbox" checked onchange="recalc()"> Chỉ swing NGOÀI (external)</label>
  </div>
  <div class="ctl" id="pctCtl" style="display:none">
    <label>Độ sâu hồi:</label>
    <input id="minRetr" type="range" min="0.05" max="0.8" step="0.05" value="0.4" oninput="recalc()">
    <span id="minRetrV">0.40</span>
  </div>
  <div class="ctl">
    <button id="editBtn" class="mode" onclick="toggleEdit()">✏️ Chế độ vẽ của ANH: TẮT</button>
    <button class="warn" onclick="clearUser()">Xoá nét anh vẽ</button>
    <button class="primary" onclick="sendToClaude()">📨 Gửi cho em</button>
    <button onclick="doExport()">📤 Export (copy tay)</button>
    <span id="sendStatus" style="font-weight:600"></span>
  </div>
</header>

<div id="csvBox" style="display:none; padding:8px 14px; border-bottom:1px solid var(--line);">
  <input type="file" id="csvFile" accept=".csv,.txt" onchange="loadCSVFile()">
  hoặc dán CSV (time,open,high,low,close):
  <textarea id="csvText" placeholder="2024-01-01 00:00,100,102,99,101&#10;..."></textarea>
  <button onclick="loadCSVText()">Nạp CSV dán</button>
</div>

<div id="chart"></div>

<div class="hint">
  <span class="legend"><span class="sw" style="background:#2157f3"></span> Zigzag của EM (thuật toán)</span>
  <span class="legend"><span class="sw" style="background:#f7b500"></span> Nét ANH vẽ (click vào nến gần đỉnh/đáy để đặt swing; click lại để xoá)</span>
  — Bật <b>Chế độ vẽ</b> rồi click lên chart. Xong bấm <b>Export</b> và dán JSON vào chat cho em.
  <div id="exportOut" style="margin-top:6px; display:none;">
    <textarea id="exportText" readonly></textarea>
    <button onclick="copyExport()">Copy</button> <span id="copied"></span>
  </div>
</div>

<script>
let chart, candleSeries, algoSeries, userSeries;
let candles = [];           // {time, open, high, low, close}
let userPoints = [];        // {time, price, type:'H'|'L'}
let algoSwings = [];
let editMode = false;

function initChart(){
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    autoSize:true,
    layout:{ background:{color:'#0e1117'}, textColor:'#e6edf3' },
    grid:{ vertLines:{color:'#1c222b'}, horzLines:{color:'#1c222b'} },
    timeScale:{ timeVisible:true, secondsVisible:false, borderColor:'#30363d', rightOffset:4, minBarSpacing:0.2 },
    rightPriceScale:{ borderColor:'#30363d' },
    crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
    // bật kéo + zoom cho cả chuột lẫn CẢM ỨNG (pinch) trên điện thoại
    handleScroll:{ mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:false },
    handleScale:{ mouseWheel:true, pinch:true, axisPressedMouseMove:true, axisDoubleClickReset:true },
    kineticScroll:{ touch:true, mouse:false },
  });
  candleSeries = chart.addCandlestickSeries({ upColor:'#089981', downColor:'#f23645', borderVisible:false, wickUpColor:'#089981', wickDownColor:'#f23645' });
  algoSeries = chart.addLineSeries({ color:'#2157f3', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
  userSeries = chart.addLineSeries({ color:'#f7b500', lineWidth:2, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
  chart.subscribeClick(onChartClick);
  // autoSize:true đã tự co giãn theo khung; gọi fit khi xoay ngang/dọc điện thoại
  window.addEventListener('orientationchange', ()=> setTimeout(()=>chart.timeScale().fitContent(),300));
}

// ---------------- Thuật toán zigzag (% độ sâu hồi) — bản PINE của em port sang JS ----------------
function computeZigzag(cs, minRetr){
  const sw=[]; if(cs.length<2) return sw;
  let cdir=1, cBase=cs[0].low, cExt=cs[0].high, cExtIdx=0;
  for(let i=1;i<cs.length;i++){
    const c=cs[i];
    if(cdir===1){
      if(c.high>cExt){cExt=c.high;cExtIdx=i;}
      const legUp=cExt-cBase;
      if(legUp>0 && (cExt-c.low)>=minRetr*legUp){
        sw.push({idx:cExtIdx,time:cs[cExtIdx].time,price:cExt,type:'H'});
        cBase=cExt;cExt=c.low;cExtIdx=i;cdir=-1;
      }
    }else{
      if(c.low<cExt){cExt=c.low;cExtIdx=i;}
      const legDn=cBase-cExt;
      if(legDn>0 && (c.high-cExt)>=minRetr*legDn){
        sw.push({idx:cExtIdx,time:cs[cExtIdx].time,price:cExt,type:'L'});
        cBase=cExt;cExt=c.high;cExtIdx=i;cdir=1;
      }
    }
  }
  sw.push({idx:cExtIdx,time:cs[cExtIdx].time,price:cExt,type:cdir===1?'H':'L',tentative:true});
  return sw;
}

// ---------------- Thuật toán FRACTAL (sóng trong sóng) — port từ Pine f_struct ----------------
// Tầng NỘI BỘ: leg nhỏ (len) -> inner BOS/CHoCH -> inner trend (itr).
// Swing NGOÀI = cực trị running của mỗi đoạn inner-trend, CHỐT khi inner đổi chiều.
function computeFractal(cs, len){
  const sw=[]; if(cs.length < len+2) return sw;
  let lg=0, lgPrev=0;
  let rH=null,rL=null;                 // running extreme nội bộ
  let ih=null,il=null,ihx=false,ilx=false,itr=0;
  let oe=null,oet=null,oeIdx=0;        // outer extreme
  for(let i=0;i<cs.length;i++){
    const c=cs[i];
    // leg kiểu LuxAlgo: bar (i-len) có cao/thấp hơn toàn bộ cửa sổ len gần nhất không
    if(i>=len){
      let hh=-Infinity, ll=Infinity;
      for(let j=i-len+1;j<=i;j++){ if(cs[j].high>hh)hh=cs[j].high; if(cs[j].low<ll)ll=cs[j].low; }
      if(cs[i-len].high>hh) lg=0;
      else if(cs[i-len].low<ll) lg=1;
    }
    const pvH=(lg-lgPrev)===-1, pvL=(lg-lgPrev)===1;  // pivot nội bộ
    lgPrev=lg;
    if(rH===null||c.high>rH) rH=c.high;
    if(rL===null||c.low<rL)  rL=c.low;
    if(pvH){ ih=rH; ihx=false; rH=c.high; rL=c.low; }
    if(pvL){ il=rL; ilx=false; rH=c.high; rL=c.low; }
    if(itr===1 && (oe===null||c.high>oe)){ oe=c.high;oet=c.time;oeIdx=i; }
    if(itr===-1&& (oe===null||c.low<oe)){  oe=c.low; oet=c.time;oeIdx=i; }
    if(ih!==null && !ihx && c.close>ih){   // inner phá đỉnh nội bộ -> chốt đáy ngoài
      if(itr===-1){ sw.push({idx:oeIdx,time:oet,price:oe,type:'L'}); oe=c.high;oet=c.time;oeIdx=i; }
      ihx=true; itr=1;
    }
    if(il!==null && !ilx && c.close<il){   // inner phá đáy nội bộ -> chốt đỉnh ngoài
      if(itr===1){ sw.push({idx:oeIdx,time:oet,price:oe,type:'H'}); oe=c.low;oet=c.time;oeIdx=i; }
      ilx=true; itr=-1;
    }
  }
  if(oe!==null) sw.push({idx:oeIdx,time:oet,price:oe,type:itr===1?'H':'L',tentative:true});
  return sw;
}

// ---------------- Tầng EXTERNAL: swing nội bộ -> swing ngoài (ĐỊNH LÝ của Rudy) ----------------
// Uptrend phải tạo ĐỈNH cao hơn + ĐÁY cao hơn; downtrend phải ĐÁY thấp hơn + ĐỈNH thấp hơn.
// Chưa đủ thì KHÔNG vẽ. Chỉ ĐẢO CHIỀU khi mức bảo vệ (đáy/đỉnh gần nhất) bị phá.
// => giá chạy lòng vòng trong range mà chưa phá cấu trúc thì không đẻ swing thừa.
function externalize(sw){
  if(sw.length<3) return sw.slice();
  const out=[];
  const pushI=(i)=>{ if(i>=0 && (!out.length || out[out.length-1].__i!==i)){ const o={...sw[i]}; o.__i=i; out.push(o);} };
  let dir=1, peakI=-1, trghI=-1, protLo=null, protHi=null;
  for(let i=0;i<sw.length;i++){
    const s=sw[i], v=s.price;
    if(s.type==='H'){
      if(dir>0){
        if(peakI<0 || v>sw[peakI].price){                 // đỉnh cao hơn -> xác nhận (đỉnh cũ + đáy hồi)
          if(trghI>=0){ pushI(peakI); pushI(trghI); protLo=sw[trghI].price; trghI=-1; }
          peakI=i;
        }
      }else{                                              // downtrend, bounce lên
        if(protHi!=null && v>protHi){ pushI(trghI); protLo=null; dir=1; peakI=i; trghI=-1; }  // phá đỉnh bảo vệ -> đảo tăng
        else if(peakI<0 || v>sw[peakI].price){ peakI=i; }
      }
    }else{ // L
      if(dir<0){
        if(trghI<0 || v<sw[trghI].price){                 // đáy thấp hơn -> xác nhận (đáy cũ + đỉnh hồi)
          if(peakI>=0){ pushI(trghI); pushI(peakI); protHi=sw[peakI].price; peakI=-1; }
          trghI=i;
        }
      }else{                                              // uptrend, pullback
        if(protLo!=null && v<protLo){ pushI(peakI); protHi=null; dir=-1; trghI=i; peakI=-1; }  // phá đáy bảo vệ -> đảo giảm
        else if(trghI<0 || v<sw[trghI].price){ trghI=i; }
      }
    }
  }
  // chốt leg đang chạy (tentative): cực trị đã xác nhận + nhịp sống sau đó
  if(dir>0){ if(peakI>=0) pushI(peakI); if(trghI>=0 && trghI>peakI) pushI(trghI); }
  else { if(trghI>=0) pushI(trghI); if(peakI>=0 && peakI>trghI) pushI(peakI); }
  out.forEach(o=>delete o.__i);
  return out;
}

// ---------------- PIVOT thuần (cho M1): tìm đỉnh/đáy luân phiên, KHÔNG skip sóng con ----------------
// M1 là khung nhỏ nhất, không còn khung dưới để lọc noise -> chỉ cần cấu trúc. externalize() lo phần HH/HL.
function computePivots(cs, len){
  const sw=[]; if(cs.length<len+2) return sw;
  let lg=0, lgPrev=0, rH=null,rHi=0, rL=null,rLi=0;
  for(let i=0;i<cs.length;i++){
    const c=cs[i];
    if(i>=len){
      let hh=-Infinity, ll=Infinity;
      for(let j=i-len+1;j<=i;j++){ if(cs[j].high>hh)hh=cs[j].high; if(cs[j].low<ll)ll=cs[j].low; }
      if(cs[i-len].high>hh) lg=0; else if(cs[i-len].low<ll) lg=1;
    }
    const pvH=(lg-lgPrev)===-1, pvL=(lg-lgPrev)===1; lgPrev=lg;
    if(rH===null||c.high>rH){rH=c.high;rHi=i;}
    if(rL===null||c.low<rL){rL=c.low;rLi=i;}
    if(pvH){ sw.push({idx:rHi,time:cs[rHi].time,price:rH,type:'H'}); rH=c.high;rHi=i; rL=c.low;rLi=i; }
    if(pvL){ sw.push({idx:rLi,time:cs[rLi].time,price:rL,type:'L'}); rH=c.high;rHi=i; rL=c.low;rLi=i; }
  }
  return sw;
}

function switchAlgo(){
  const algo=document.getElementById('algo').value;
  document.getElementById('fracCtl').style.display = algo==='fractal'?'flex':'none';
  document.getElementById('pctCtl').style.display  = algo==='pct'?'flex':'none';
  recalc();
}

function recalc(){
  if(!candles.length) return;
  const algo=document.getElementById('algo').value;
  if(algo==='fractal'){
    const len=parseInt(document.getElementById('innerLen').value)||3;
    const tf=document.getElementById('tf').value;
    // M1 = khung nhỏ nhất: dùng pivot thuần (không skip sóng con). Khung lớn hơn: fractal sóng-trong-sóng.
    const isM1 = /^1m$/i.test(tf);
    algoSwings = isM1 ? computePivots(candles,len) : computeFractal(candles,len);
    if(document.getElementById('extFilter').checked) algoSwings=externalize(algoSwings);
  }else{
    const mr=parseFloat(document.getElementById('minRetr').value);
    document.getElementById('minRetrV').textContent=mr.toFixed(2);
    algoSwings=computeZigzag(candles,mr);
  }
  algoSeries.setData(algoSwings.map(s=>({time:s.time,value:s.price})));
}

// ---------------- Edit: anh click đặt/xoá swing ----------------
function toggleEdit(){
  editMode=!editMode;
  const b=document.getElementById('editBtn');
  b.textContent='✏️ Chế độ vẽ của ANH: '+(editMode?'BẬT':'TẮT');
  b.classList.toggle('modeOn',editMode);
}
function onChartClick(param){
  if(!editMode || !param.time || !param.point) return;
  const price=candleSeries.coordinateToPrice(param.point.y);
  if(price==null) return;
  // tìm nến gần nhất theo time
  let best=null,bd=Infinity;
  for(const c of candles){ const d=Math.abs(c.time-param.time); if(d<bd){bd=d;best=c;} }
  if(!best) return;
  // snap vào high hay low tuỳ click gần cái nào
  const toH=Math.abs(price-best.high), toL=Math.abs(price-best.low);
  const type=toH<=toL?'H':'L';
  const snapP=type==='H'?best.high:best.low;
  // toggle: nếu đã có điểm ở nến này -> xoá
  const existing=userPoints.findIndex(p=>p.time===best.time);
  if(existing>=0) userPoints.splice(existing,1);
  else userPoints.push({time:best.time,price:snapP,type});
  renderUser();
}
function renderUser(){
  userPoints.sort((a,b)=>a.time-b.time);
  userSeries.setData(userPoints.map(p=>({time:p.time,value:p.price})));
  userSeries.setMarkers(userPoints.map(p=>({time:p.time,position:p.type==='H'?'aboveBar':'belowBar',color:'#f7b500',shape:p.type==='H'?'arrowDown':'arrowUp',text:p.type})));
}
function clearUser(){ userPoints=[]; renderUser(); }

// ---------------- Export ----------------
const RELAY='https://ntfy.sh/rudy-zigzag-lab-7h3k9x2';  // kênh trung gian Claude đọc
function buildExport(){
  return {
    symbol:document.getElementById('sym').value,
    tf:document.getElementById('tf').value,
    algo:document.getElementById('algo').value,
    innerLen:parseInt(document.getElementById('innerLen').value),
    minRetr:parseFloat(document.getElementById('minRetr').value),
    nCandles:candles.length,
    timeRange: candles.length?[candles[0].time,candles[candles.length-1].time]:null,
    algoSwings: algoSwings.map(s=>({t:s.time,p:+s.price.toFixed(5),type:s.type})),
    userSwings: userPoints.map(p=>({t:p.time,p:+p.price.toFixed(5),type:p.type})),
  };
}
function doExport(){
  const box=document.getElementById('exportOut');
  box.style.display='block';
  document.getElementById('exportText').value=JSON.stringify(buildExport());
}
function sendToClaude(){
  if(!candles.length){ document.getElementById('sendStatus').textContent='⚠ chưa có data'; return; }
  const st=document.getElementById('sendStatus');
  st.style.color='#f7b500'; st.textContent='⏳ đang gửi...';
  fetch(RELAY,{method:'POST',body:JSON.stringify(buildExport())})
    .then(r=>{ if(!r.ok) throw 0; st.style.color='#089981'; st.textContent='✓ Đã gửi! Nhắn Claude: "nhận chưa"'; })
    .catch(()=>{ st.style.color='#f23645'; st.textContent='✗ gửi lỗi — bấm "Export (copy tay)" dán vào chat'; });
}
function copyExport(){
  const t=document.getElementById('exportText'); t.select(); document.execCommand('copy');
  document.getElementById('copied').textContent='✓ đã copy, dán vào chat cho em';
}

// ---------------- Data ----------------
document.getElementById('src').addEventListener('change',e=>{
  document.getElementById('binCtl').style.display = e.target.value==='binance'?'flex':'none';
  document.getElementById('csvBox').style.display = e.target.value==='csv'?'block':'none';
  if(e.target.value==='sample') loadSample();
});

async function loadData(){
  const src=document.getElementById('src').value;
  if(src==='binance') return loadBinance();
  if(src==='sample') return loadSample();
}
async function loadBinance(){
  const sym=document.getElementById('sym').value.toUpperCase();
  const tf=document.getElementById('tf').value;
  const lim=document.getElementById('lim').value;
  try{
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=${lim}`);
    const d=await r.json();
    if(!Array.isArray(d)) throw new Error(JSON.stringify(d));
    candles=d.map(k=>({time:Math.floor(k[0]/1000),open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));
    applyData();
  }catch(e){ alert('Lỗi tải Binance: '+e.message+'\n(Thử symbol khác hoặc dùng CSV cho XAU/Oil)'); }
}
function parseCSV(txt){
  const rows=txt.trim().split(/\r?\n/).filter(x=>x.trim());
  const out=[];
  for(let r of rows){
    const parts=r.split(/[,;\t]/).map(x=>x.trim());
    if(parts.length<5) continue;
    if(isNaN(+parts[1])) continue; // header
    let t=parts[0];
    let ts = /^\d+$/.test(t) ? (t.length>10? Math.floor(+t/1000):+t) : Math.floor(Date.parse(t.replace(' ','T'))/1000);
    if(isNaN(ts)) continue;
    out.push({time:ts,open:+parts[1],high:+parts[2],low:+parts[3],close:+parts[4]});
  }
  out.sort((a,b)=>a.time-b.time);
  // khử trùng time
  const uniq=[]; let last=null;
  for(const c of out){ if(c.time!==last){uniq.push(c);last=c.time;} }
  return uniq;
}
function loadCSVText(){ candles=parseCSV(document.getElementById('csvText').value); applyData(); }
function loadCSVFile(){
  const f=document.getElementById('csvFile').files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{ candles=parseCSV(rd.result); applyData(); }; rd.readAsText(f);
}
function loadSample(){
  // sóng mẫu: tăng có pullback -> giảm -> tăng, để test zigzag
  candles=[]; let t=Math.floor(Date.now()/1000)-500*3600, p=100;
  const seed=[]; let x=0;
  for(let i=0;i<500;i++){
    // tạo xu hướng dạng sin + nhiễu để có swing rõ
    const trend=20*Math.sin(i/40)+10*Math.sin(i/11);
    const o=p; const noise=(Math.sin(i*1.7)+Math.cos(i*2.3))*0.6;
    const base=100+trend+noise;
    const hi=base+Math.abs(Math.sin(i*3.1))*1.5+0.5;
    const lo=base-Math.abs(Math.cos(i*2.7))*1.5-0.5;
    const cl=base+Math.sin(i*0.9)*0.8;
    candles.push({time:t+i*3600,open:+o.toFixed(2),high:+Math.max(hi,o,cl).toFixed(2),low:+Math.min(lo,o,cl).toFixed(2),close:+cl.toFixed(2)});
    p=cl;
  }
  applyData();
}
function applyData(){
  if(!candles.length){ alert('Không có dữ liệu'); return; }
  candleSeries.setData(candles);
  userPoints=[]; renderUser();
  recalc();
  chart.timeScale().fitContent();
}

// ---------------- Boot ----------------
initChart();
loadBinance();
</script>
